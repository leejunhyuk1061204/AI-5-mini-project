# Application
spring.application.name=backend

# Server
server.port=8080

# MySQL (공유 서버)
spring.datasource.url=jdbc:mysql://192.168.0.49:3306/mini_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=team_user
spring.datasource.password=1234

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.root=INFO
logging.level.com.minipr=INFO

# JPA Batch Insert
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Python AI Server
python.ai.url=http://localhost:8001
python.ai.timeout-seconds=60

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Sliding Window Buffer
buffer.window-size=1000
buffer.overhead-ratio=0.3
buffer.flush.batch-size=200
buffer.flush.interval-ms=1000

# Async Timeout
spring.mvc.async.request-timeout=120000

# File Logging
logging.file.name=../logs/backend.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=100MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
