# Application
spring.application.name=backend

# Server
server.port=8080

# MySQL (공유 서버)
spring.datasource.url=jdbc:mysql://192.168.0.49:3306/mini_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=team_user
spring.datasource.password=1234

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JPA Batch Insert 성능 튜닝 (중요)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Python AI Server
python.ai.url=http://localhost:8001

# CORS
cors.allowed-origins=http://localhost:3000

# =========================
# Sliding Window Buffer 설정
# =========================

# 메모리에 유지할 목표 개수 (회의별)
buffer.window-size=1000

# DB flush 중 임시 메모리 여유 (30%)
buffer.overhead-ratio=0.3

# 한 번에 DB에 저장할 개수
buffer.flush.batch-size=200

# flush 주기 (ms)
buffer.flush.interval-ms=1000
